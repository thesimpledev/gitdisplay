# Deploys run ONLY on a release tag. Nothing triggers on a branch push.
# Auth is GitHub OIDC assuming an IAM role; this repo holds zero AWS secrets.
# The role ARN, region, and function name are GitHub variables: identifiers,
# not credentials.
name: deploy

on:
  push:
    tags:
      - 'prod-*'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # No module cache on a release build: a poisoned cache entry would
      # otherwise reach the deployed binary.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Gates
        run: |
          go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install github.com/kisielk/errcheck@v1.30.0
          go install github.com/mgechev/revive@v1.17.1
          staticcheck ./...
          errcheck ./...
          revive -set_exit_status ./...

      - name: Tests
        run: go test ./... -race -vet=all -shuffle=on -count=1

      - name: Build
        run: make build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # update-function-code returns the new CodeSha256, so the deploy is
      # verified from its own response; the role needs no read permissions.
      - name: Deploy
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          local_sha="$(openssl dgst -sha256 -binary dist/gitdisplay-lambda.zip | base64)"
          deployed_sha="$(aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://dist/gitdisplay-lambda.zip \
            --query CodeSha256 --output text)"
          echo "local zip sha256:  $local_sha"
          echo "deployed code sha: $deployed_sha"
          test "$local_sha" = "$deployed_sha"
